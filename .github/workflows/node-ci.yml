name: Reusable Node CI

on:
  workflow_call: 
    inputs:
      node-version:
        description: Node.js version
        required: false
        type: string
        default: '22'

jobs:
   verify:
    runs-on: ubuntu-22.04

    steps:
       - uses: actions/checkout@v4

       - uses: actions/setup-node@v4
         with:
            node-version: ${{inputs.node-version}}
            cache: npm
    
       - run: npm ci
       - run: npm run lint
       - run: npm run typecheck
       - run: npm run build